# Generic compute fanout: run shard-aware commands across N jobs.
#
# APPROVAL ECONOMY: one push may carry MULTIPLE job specs
# (jobs/<project>/<job-id>.json) — a single push_files call (one user
# approval) fans out to every spec in it. The setup job builds a matrix
# over (spec x shard); each shard job runs its spec's command; the collect
# job is a per-spec matrix that merges each job's artifacts and commits
# results/<project>/<job-id>/.
#
# TRIGGER DISCIPLINE (hygiene rule — see root README):
#   * fires ONLY on push to jobs/<project>/<job-id>.json (paths: ['jobs/**'])
#     or manual workflow_dispatch (single spec via inputs);
#   * the collect job commits ONLY under results/<project>/<job-id>/, which
#     never matches jobs/**, so its own push can NEVER retrigger dispatch.
#   * GitHub forbids combining paths + paths-ignore on one event, so the
#     single positive filter + the collect write-scope IS the guard.
#
# Per shard job:
#   1. checks out the repo,
#   2. restores an optional actions/cache,
#   3. optionally logs in to a registry, pulls $IMAGE,
#   4. runs: docker run --rm -v $PWD:/work -w /work
#            -e SHARD_IDX=<i> -e SHARD_COUNT=<n> -e OUT_DIR=/work/out
#            -e JOB_ID=<job-id> -e PROJECT=<project>
#            [extra env] $IMAGE sh -c "$COMMAND"
#   5. ALWAYS writes out/_shard_status.json (driver verdict or infra error),
#      uploads ./out as artifact shard-<project>-<job-id>-<idx>.
# Per-spec collect job downloads its job's artifacts, lays them out under
# results/<project>/<job-id>/shard-<i>/, writes STATUS.json + FILES.json,
# and commits back with GITHUB_TOKEN (the ONLY job with contents:write).
#
# Shard contract (project drivers must honor):
#   * $SHARD_IDX / $SHARD_COUNT select the work slice (0-based, contiguous);
#   * all outputs go under $OUT_DIR;
#   * drivers are resumable/idempotent per shard (safe to re-run).
# Aggregation happens AGENT-SIDE (lib/fanout.py reads result files and runs
# the project's aggregate script locally) — never in this workflow.
name: fanout-dispatch

on:
  push:
    paths: ['jobs/**']
  workflow_dispatch:
    inputs:
      project:
        description: "Project dir under projects/ (namespaces jobs/ and results/)"
        required: true
      job_id:
        description: "Job id (default: generated)"
        default: ""
      image:
        description: "Docker image (with digest pin for reproducibility)"
        required: true
      command:
        description: "Shell command run in each shard"
        required: true
      shards:
        description: "Shard count (1..64)"
        default: "8"
      timeout_minutes:
        description: "Per-shard job timeout (clamped to 300)"
        default: "60"
      env:
        description: "Extra KEY=VALUE env lines for the shard command"
        default: ""
      cache_key:
        description: "Cache key; stored as fanout-<project>-<key> (empty = no cache)"
        default: ""
      cache_paths:
        description: "actions/cache paths (newline-separated, needs cache_key)"
        default: ""
      registry_user:
        description: "Registry username for docker login (empty = anonymous pull)"
        default: ""
      registry_password:
        description: "Registry password/token (empty = anonymous pull)"
        default: ""

# Least privilege: everything here is read-only EXCEPT the collect job,
# which overrides with contents:write for its results commit.
permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.spec.outputs.specs }}
      combos: ${{ steps.spec.outputs.combos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: spec
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import base64, glob, json, os, subprocess, sys

          def out(k, v):
              print(f"{k}={v}")

          specs = []
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              ctx = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
              inp = ctx["inputs"]
              project = inp["project"].strip()
              job_id = inp.get("job_id", "").strip() or \
                  f"manual-{ctx['run_id']}"
              specs.append({
                  "project": project, "job_id": job_id,
                  "image": inp["image"], "command": inp["command"],
                  "shards": int(inp.get("shards", "8")),
                  "timeout_minutes": int(inp.get("timeout_minutes", "60")),
                  "env": inp.get("env", ""),
                  "cache_key": inp.get("cache_key", ""),
                  "cache_paths": inp.get("cache_paths", ""),
                  "registry_user": inp.get("registry_user", ""),
                  "registry_password": inp.get("registry_password", ""),
                  "priority": "manual",
              })
          else:
              sha = os.environ["GITHUB_SHA"]
              before = subprocess.run(
                  ["git", "rev-parse", os.environ.get(
                      "GITHUB_EVENT_BEFORE", "HEAD~1")],
                  capture_output=True, text=True).stdout.strip()
              if before.startswith("0000") or not before:
                  files = glob.glob("jobs/*/*.json")
              else:
                  diff = subprocess.run(
                      ["git", "diff", "--name-only", before, sha, "--",
                       "jobs/"], capture_output=True, text=True)
                  files = [f for f in diff.stdout.split()
                           if f.startswith("jobs/") and f.endswith(".json")]
              # APPROVAL ECONOMY: one push may carry many specs; each is
              # validated independently (agent contract: every file under
              # jobs/<project>/<job-id>.json is a job spec).
              if not files:
                  print("::error::no job specs found in push",
                        file=sys.stderr)
                  sys.exit(1)
              for f in files:
                  spec = json.load(open(f))
                  project, job_id = spec["project"], spec["job_id"]
                  # namespacing hygiene: spec path must match its content
                  want = f"jobs/{project}/{job_id}.json"
                  if f != want:
                      print(f"::error::spec path {f} != {want}",
                            file=sys.stderr)
                      sys.exit(1)
                  specs.append(spec)

          combos = []
          live_specs = []
          for spec in specs:
              project, job_id = spec["project"], spec["job_id"]
              # validate
              for f in ("project", "job_id", "image", "command"):
                  assert spec.get(f), f"spec {job_id} missing {f}"
              assert "/" not in project and "/" not in job_id, \
                  "project/job_id must not contain '/'"
              spec["shards"] = max(1, min(64, int(spec.get("shards", 8))))
              # hard cap: no GHA job may exceed 5h
              spec["timeout_minutes"] = max(1, min(300,
                  int(spec.get("timeout_minutes", 60))))
              if spec.get("cache_key"):
                  spec["cache_key"] = \
                      f"fanout-{project}-{spec['cache_key']}"

              # idempotency: a re-pushed spec with terminal results is a no-op
              st_path = f"results/{project}/{job_id}/STATUS.json"
              if os.path.exists(st_path):
                  st = json.load(open(st_path)).get("status")
                  if st in ("done", "partial", "failed"):
                      print(f"spec {project}/{job_id} already terminal "
                            f"({st}); skipping")
                      continue
              live_specs.append(spec)
              spec_b64 = base64.b64encode(
                  json.dumps(spec).encode()).decode()
              for i in range(spec["shards"]):
                  combos.append({"project": project, "job_id": job_id,
                                 "spec_b64": spec_b64, "idx": i,
                                 "shards": spec["shards"]})

          out("specs", json.dumps([
              {"project": s["project"], "job_id": s["job_id"],
               "spec_b64": base64.b64encode(
                   json.dumps(s).encode()).decode()}
              for s in live_specs]))
          out("combos", json.dumps(combos))
          # informational only: stdout is redirected to GITHUB_OUTPUT,
          # so this MUST go to stderr (a bare "setup: ..." line is not
          # valid name=value output format and fails the step).
          print(f"setup: {len(live_specs)} live specs, "
                f"{len(combos)} shard combos", file=sys.stderr)
          EOF

  shard:
    needs: setup
    # Concurrency per (project, job-id): two dispatches for the same job
    # never clobber each other's results; never cancel a running batch.
    # (matrix.combo carries this combo's project/job_id.)
    concurrency:
      group: fanout-${{ matrix.combo.project }}-${{ matrix.combo.job_id }}
      cancel-in-progress: false
    if: needs.setup.outputs.combos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJson(needs.setup.outputs.combos) }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import base64, json, os
          spec = json.loads(base64.b64decode(
              os.environ["SPEC_B64"]).decode())
          for k in ("image", "command", "timeout_minutes", "env",
                    "cache_key", "cache_paths", "registry_user",
                    "registry_password", "project", "job_id"):
              v = str(spec.get(k, ""))
              print(f"{k}<<PYEOF_{k}")
              print(v)
              print(f"PYEOF_{k}")
          EOF
        env:
          SPEC_B64: ${{ matrix.combo.spec_b64 }}
      - name: enforce per-shard timeout cap
        run: |
          T='${{ steps.cfg.outputs.timeout_minutes }}'
          # NB: plain `[ "$T" -gt 300 ] && exit 1` fails the step under
          # bash -e when T<=300 (the false test returns 1); use if/fi.
          if [ "$T" -gt 300 ]; then
            echo "timeout $T > 300 cap"
            exit 1
          fi
          echo "shard timeout: ${T}m (cap 300m)"
      - name: restore cache
        if: steps.cfg.outputs.cache_key != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.cfg.outputs.cache_paths }}
          key: ${{ steps.cfg.outputs.cache_key }}-${{ matrix.combo.idx }}
          restore-keys: ${{ steps.cfg.outputs.cache_key }}-
      - name: registry login
        if: steps.cfg.outputs.registry_user != ''
        run: |
          echo "${{ steps.cfg.outputs.registry_password }}" | docker login \
            "$(echo '${{ steps.cfg.outputs.image }}' | cut -d/ -f1)" \
            -u "${{ steps.cfg.outputs.registry_user }}" --password-stdin
      - name: run shard
        timeout-minutes: ${{ fromJson(steps.cfg.outputs.timeout_minutes) }}
        run: |
          mkdir -p out
          P='${{ matrix.combo.project }}'
          J='${{ matrix.combo.job_id }}'
          ENV_ARGS="-e SHARD_IDX=${{ matrix.combo.idx }} -e OUT_DIR=/work/out -e JOB_ID=$J -e PROJECT=$P"
          SC='${{ matrix.combo.shards }}'
          ENV_ARGS="$ENV_ARGS -e SHARD_COUNT=$SC"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            ENV_ARGS="$ENV_ARGS -e $line"
          done <<< "${{ steps.cfg.outputs.env }}"
          set +e
          # shellcheck disable=SC2086
          docker run --rm -v "$PWD:/work" -w /work $ENV_ARGS \
            "${{ steps.cfg.outputs.image }}" sh -c "${{ steps.cfg.outputs.command }}"
          RC=$?
          set -e
          # the status file ALWAYS lands, even if the driver crashed
          SHARD_JSON=$(python3 - "$RC" <<'EOF'
          import json, sys
          rc = int(sys.argv[1])
          print(json.dumps({"shard_idx": int("${{ matrix.combo.idx }}"),
                            "driver": "done" if rc == 0 else "error",
                            "rc": rc}))
          EOF
          )
          echo "$SHARD_JSON" > out/_shard_status.json
          echo "shard rc=$RC"
      - name: save cache
        if: steps.cfg.outputs.cache_key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.cfg.outputs.cache_paths }}
          key: ${{ steps.cfg.outputs.cache_key }}-${{ matrix.combo.idx }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.combo.project }}-${{ matrix.combo.job_id }}-${{ matrix.combo.idx }}
          path: out/
          if-no-files-found: error

  collect:
    needs: [setup, shard]
    # Per-spec collect matrix: each spec's results merge under its own
    # concurrency group, so two dispatches for the same (project, job-id)
    # never clobber each other; never cancel a running batch.
    concurrency:
      group: fanout-${{ matrix.spec.project }}-${{ matrix.spec.job_id }}
      cancel-in-progress: false
    # Least privilege: ONLY this job may write (its results commit).
    permissions:
      contents: write
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.specs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJson(needs.setup.outputs.specs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # scoped to THIS run and THIS spec: other runs/specs never leak in
          pattern: shard-${{ matrix.spec.project }}-${{ matrix.spec.job_id }}-*
          path: _artifacts
      - id: merge
        run: |
          python3 - <<'EOF'
          import base64, glob, json, os, shutil

          spec = json.loads(base64.b64decode(
              os.environ["SPEC_B64"]).decode())
          project, job_id = spec["project"], spec["job_id"]
          shards = spec["shards"]
          dest = f"results/{project}/{job_id}"
          os.makedirs(dest, exist_ok=True)

          statuses, n_ok = [], 0
          for i in range(shards):
              adir = (f"_artifacts/shard-{project}-{job_id}-{i}")
              sdir = f"{dest}/shard-{i}"
              present = os.path.isdir(adir)
              driver, detail = "missing", "no artifact"
              if present:
                  shutil.rmtree(sdir, ignore_errors=True)
                  shutil.copytree(adir, sdir)
                  stf = os.path.join(sdir, "_shard_status.json")
                  if os.path.exists(stf):
                      st = json.load(open(stf))
                      driver = st.get("driver", "unknown")
                      detail = f"rc={st.get('rc')}"
                  else:
                      driver, detail = "unknown", "no _shard_status.json"
              if driver == "done":
                  n_ok += 1
              statuses.append({"idx": i, "artifact": present,
                               "driver": driver, "detail": detail})

          status = ("done" if n_ok == shards
                    else "failed" if n_ok == 0 else "partial")
          import datetime
          payload = {
              "job_id": job_id, "project": project, "status": status,
              "shards": shards, "n_ok": n_ok, "n_failed": shards - n_ok,
              "shard_status": statuses, "spec": spec,
              "finished_at": datetime.datetime.now(
                  datetime.timezone.utc).isoformat(),
          }
          json.dump(payload, open(f"{dest}/STATUS.json", "w"), indent=1)
          files = sorted(os.path.relpath(p, dest)
                         for p in glob.glob(f"{dest}/**", recursive=True)
                         if os.path.isfile(p))
          json.dump({"job_id": job_id, "files": files},
                    open(f"{dest}/FILES.json", "w"), indent=1)
          print(f"collect: {status} ({n_ok}/{shards} shards ok)")
          EOF
        env:
          SPEC_B64: ${{ matrix.spec.spec_b64 }}
      - name: commit results
        run: |
          # Writes ONLY under results/<project>/<job-id>/ — never matches
          # the jobs/** push trigger, so this commit cannot retrigger dispatch.
          git config user.name "fanout-collect[bot]"
          git config user.email "fanout-collect[bot]@users.noreply.github.com"
          git add "results/${{ matrix.spec.project }}/${{ matrix.spec.job_id }}"
          git commit -m "results: ${{ matrix.spec.project }}/${{ matrix.spec.job_id }}" || \
            { echo "nothing to commit"; exit 0; }
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}" && break
            echo "push attempt $attempt failed; retrying in 10s"
            sleep 10
          done
